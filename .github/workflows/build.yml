name: Build and Deploy Flutter Web

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取 norx 仓库
      - name: Checkout norx code
        uses: actions/checkout@v4

      # 2. 配置 Git Token 凭据（用于拉取私有库 nexa）
      - name: Configure Git Credentials
        run: |
          git config --global url."https://${{ secrets.DART_WORKFLOW_TRIGGER }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${{ secrets.DART_WORKFLOW_TRIGGER }}@github.com/".insteadOf "git@github.com:"

      # 3. 核心步骤：直接将 nexa 仓库 Clone 到同级目录 ../nexa
      - name: Checkout nexa code to relative path
        run: |
          git clone --depth 1 https://github.com/u4-d/nexa.git ../nexa

      # 4. 安装 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      # 5. 安装依赖（由于 ../nexa 已经存在，pubspec.yaml 里的 path: 依赖将直接被匹配识别）
      - name: Install Dependencies
        run: flutter pub get

      # 6. 构建 Web 静态资源
      - name: Build Web
        run: flutter build web --base-href "/norx/"

      # 7. 自动推送产物到 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web