name: Build and Deploy Flutter Web

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout norx code
        uses: actions/checkout@v4

      # 1. 配置 Git 凭据（用于自动拉取 nexa 私有仓库）
      - name: Configure Git Credentials
        run: |
          git config --global url."https://${{ secrets.DART_WORKFLOW_TRIGGER }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${{ secrets.DART_WORKFLOW_TRIGGER }}@github.com/".insteadOf "git@github.com:"

      # 2. 安装 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      # 3. 核心步骤：自动将本地 path: ../nexa/ 转换生成 CI 用的 pubspec_overrides.yaml
      - name: Auto-generate CI Pubspec Overrides
        run: |
          python3 -c '
          import yaml

          with open("pubspec.yaml", "r") as f:
              data = yaml.safe_load(f)

          overrides = {}
          
          # 读取 pubspec.yaml 中的 dependency_overrides 或 dependencies
          sources = [data.get("dependency_overrides", {}), data.get("dependencies", {})]
          for src in sources:
              if not src:
                  continue
              for name, spec in src.items():
                  if isinstance(spec, dict) and "path" in spec:
                      path_val = spec["path"]
                      # 如果使用了 ../nexa/ 相对路径，转换为 Git 依赖
                      if "../nexa/" in path_val:
                          relative_path = path_val.replace("../nexa/", "")
                          overrides[name] = {
                              "git": {
                                  "url": "https://github.com/u4-d/nexa.git",
                                  "path": relative_path,
                                  "ref": "main"
                              }
                          }

          with open("pubspec_overrides.yaml", "w") as f:
              yaml.dump({"dependency_overrides": overrides}, f, default_flow_style=False)
          '
          
          echo "=== 自动生成的 pubspec_overrides.yaml 内容 ==="
          cat pubspec_overrides.yaml

      # 4. 安装依赖（Dart 会自动加载上面生成的 pubspec_overrides.yaml）
      - name: Install Dependencies
        run: flutter pub get

      # 5. 构建 Web 静态资源
      - name: Build Web
        run: flutter build web --base-href "/norx/"

      # 6. 自动推送产物到 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web