name: Build and Test

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout norx code
        uses: actions/checkout@v4

      # 如果 nexa 是私有仓库，配置 SSH 私钥以拉取私有 Git 依赖
      - name: Set up SSH Key for private dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NEXA_DEPLOY_KEY }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build
        run: flutter build web # 或对应的平台构建命令