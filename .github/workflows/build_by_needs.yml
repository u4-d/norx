# 只拉取克隆nexa需要的部分进行编译
name: Build and Deploy By Needs

on:
  push:
    branches: [ main ]
  workflow_dispatch: # ✅ 添加这行，开启手动触发按钮
# ✅ 显式授予 Actions 写权限
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取 norx 仓库
      - name: Checkout norx code
        uses: actions/checkout@v4

      # 2. 【已优化】利用 Sparse-Checkout 按需拉取 nexa 必需的 packages
      - name: Sparse Checkout nexa packages
        run: |
          mkdir -p ../nexa
          cd ../nexa
          git init
          git config core.sparseCheckout true
          
          # 写入需要的 7 个子包目录
          cat << 'EOF' > .git/info/sparse-checkout
          packages/dart/models
          packages/dart/app_config
          packages/dart/my_supabase_service
          packages/dart/my_logger
          packages/dart/my_analyzer
          packages/flutter/stock/ranking
          packages/dart/utils
          EOF
          
          git remote add origin https://${{ secrets.DART_WORKFLOW_TRIGGER }}@github.com/u4-d/nexa.git
          git pull --depth 1 origin main

      # 3. 安装 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      # 4. 强制在 CI 环境注入本地路径重写
      - name: Force Local Path Overrides
        run: |
          cat << 'EOF' > pubspec_overrides.yaml
          dependency_overrides:
            models:
              path: ../nexa/packages/dart/models
            app_config:
              path: ../nexa/packages/dart/app_config
            my_supabase_service:
              path: ../nexa/packages/dart/my_supabase_service
            my_logger:
              path: ../nexa/packages/dart/my_logger
            my_analyzer:
              path: ../nexa/packages/dart/my_analyzer
            ranking:
              path: ../nexa/packages/flutter/stock/ranking
            utils:
              path: ../nexa/packages/dart/utils
          EOF

      # 5. 执行依赖安装
      - name: Install Dependencies
        run: flutter pub get

      # 6. 构建 Web 静态资源
      - name: Build Web
        run: flutter build web --base-href "/norx/"

      # 7. 自动推送产物到 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web